# Pruebas automáticas en modo simulación: no usan llaves ni gastan cuota.
# Se ejecutan cada vez que subes cambios; si algo se rompe, verás una ❌ en la pestaña Actions.
name: pruebas

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODO_SIMULACION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pytest -q
      - run: python analizar.py AAPL --simulacion
