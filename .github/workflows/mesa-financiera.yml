# Mesa Financiera en la nube: funciona con tu computadora apagada.
#  · Cada 8 minutos revisa si escribiste /analiza TICKER en Telegram y responde.
#  · También puedes lanzarlo a mano (incluso desde la app de GitHub en tu celular):
#    Actions → mesa-financiera → Run workflow → escribe el ticker.
name: mesa-financiera

on:
  schedule:
    - cron: "*/8 * * * *"           # hora UTC; GitHub puede retrasar unos minutos las ejecuciones
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar (déjalo vacío para solo revisar Telegram)"
        required: false
        default: "AAPL"
      simulacion:
        description: "Modo simulación (sin gastar llaves)"
        type: boolean
        default: false

concurrency:                        # evita dos ejecuciones al mismo tiempo
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependencias
        run: pip install -r requirements.lock

      - name: Analizar el ticker indicado a mano
        if: github.event_name == 'workflow_dispatch' && inputs.ticker != ''
        run: python analizar.py "$TICKER" --telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY || secrets.OPENAI_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MODO_SIMULACION: ${{ inputs.simulacion == true && '1' || '0' }}
          TICKER: ${{ inputs.ticker }}  # se pasa como variable, nunca se pega dentro del comando

      - name: Revisar mensajes pendientes en Telegram
        if: github.event_name != 'workflow_dispatch' || inputs.ticker == ''
        run: python revisar_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY || secrets.OPENAI_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          MODO_SIMULACION: ${{ inputs.simulacion == true && '1' || '0' }}

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 14
